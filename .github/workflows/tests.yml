name: Tests

# Runs the pure-logic unit test suite (see tests/README notes in
# tests/test_pipeline.py: no network, no heavy optional deps required)
# on every push and pull request against main. Real scraping runs need
# outbound network access and are not part of this CI -- see
# README.md "## Tests".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Run test suite
        run: python -m unittest discover -s tests -v
