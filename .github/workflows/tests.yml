name: Tests

# Runs the pure-logic unit test suite (see tests/README notes in
# tests/test_pipeline.py: no network, no heavy optional deps required)
# on every push and pull request against main. Real scraping runs need
# outbound network access and are not part of this CI -- see
# README.md "## Tests".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is end-of-life (Oct 2025) and actions/setup-python
          # has no 3.9 build for Ubuntu 26.04, which `ubuntu-latest`
          # became in October 2026. It stays tested on 24.04 because
          # it's still what some users (and this project's own dev Mac)
          # run -- see requires-python in pyproject.toml.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Run test suite
        run: python -m unittest discover -s tests -v
